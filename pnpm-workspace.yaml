packages:
  - packages/core
  - packages/server
  - packages/web
linkWorkspacePackages: true
allowBuilds:
  better-sqlite3: true
  esbuild: true
  '@tailwindcss/oxide': true
supportedArchitectures:
  os: [current, linux]
  cpu: [current, x64]
  libc: [glibc]
overrides:
  'nodemailer@10.0.1': 10.0.9
  'fast-uri@3.1.7': 3.1.8
  'fast-uri@4.1.4': 4.1.5
  'ip-address@10.7.0': 10.7.1
  'brace-expansion@5.0.9': 5.0.12
  'fastify@5.12.3': 5.12.5
